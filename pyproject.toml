[project]
name = "agri-machinery-failure-prediction"
version = "0.1.0"
description = "Pre-delivery scaffold for machinery failure data preparation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars",
    "scikit-learn",
    "matplotlib",
    "pyarrow",
    "nbformat",
    "jupytext",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agrofail"]

[tool.ruff]
line-length = 100
# Course transcriptions and process tracking must never be reformatted:
# their code samples stay byte-faithful to the PDF sources.
extend-exclude = ["docs", "odd", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

services:
  chiqui_web:
    image: ${CHIQUI_IMAGE:-sion/chiqui-web:local}
    container_name: chiqui_web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/sion_factory/storage/chiqui/docs:/usr/share/nginx/html/docs:ro
    networks:
      - sion_frontend
      - sion_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sion_frontend:
    external: true
  sion_backend:
    external: true
